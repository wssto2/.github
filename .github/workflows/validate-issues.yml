name: Validate Issues

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate issue
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;

            //
            // 1. Determine which template was used.
            //
            let template = null;

            if (body.includes('<!-- ISSUE_TEMPLATE:BUG -->')) {
              template = 'BUG';
            } else if (body.includes('<!-- ISSUE_TEMPLATE:FEATURE -->')) {
              template = 'FEATURE';
            } else if (body.includes('<!-- ISSUE_TEMPLATE:TASK -->')) {
              template = 'TASK';
            }

            //
            // 2. Blank issue = automatically invalid.
            //
            if (!template) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['invalid']
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `## ⚠️ Neispravan način prijave

                Ovaj issue nije otvoren putem jednog od predviđenih predložaka.

                Molimo otvorite novi issue i odaberite odgovarajući predložak:

                - 🐛 **Prijava greške**
                - 💡 **Zahtjev za značajku**
                - 🛠️ **Zadatak / Posao**

                Ovaj issue je automatski zatvoren.`
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                state: 'closed'
              });

              return;
            }

            //
            // 3. Validate the actual content.
            //
            const failures = [];

            function sectionContent(sectionName) {
              const regex = new RegExp(
                `## ${sectionName}\\s*([\\s\\S]*?)(?=\\n## |$)`,
                'i'
              );

              const match = body.match(regex);

              if (!match) {
                return '';
              }

              return match[1]
                .replace(/<!--[\s\S]*?-->/g, '')
                .trim();
            }

            function isMeaningful(text) {
              if (!text) return false;

              // Remove common Markdown/template placeholders.
              const cleaned = text
                .replace(/\(.*?\)/g, '')
                .replace(/Korak [ABC]/gi, '')
                .replace(/Stavka [123]/gi, '')
                .trim();

              return cleaned.length >= 20;
            }

            //
            // BUG
            //
            if (template === 'BUG') {
              const summary = sectionContent('Sažetak');
              const reproduction = sectionContent('Koraci za reprodukciju');
              const expected = sectionContent('Očekivano ponašanje');
              const actual = sectionContent('Stvarno ponašanje');
              const environment = sectionContent('Okruženje');

              if (!isMeaningful(summary)) {
                failures.push('**Sažetak** nije dovoljno opisan.');
              }

              if (!isMeaningful(reproduction)) {
                failures.push('**Koraci za reprodukciju** nisu navedeni.');
              }

              if (!isMeaningful(expected)) {
                failures.push('**Očekivano ponašanje** nije opisano.');
              }

              if (!isMeaningful(actual)) {
                failures.push('**Stvarno ponašanje** nije opisano.');
              }

              if (!isMeaningful(environment)) {
                failures.push('**Okruženje** nije navedeno.');
              }
            }

            //
            // FEATURE
            //
            if (template === 'FEATURE') {
              const summary = sectionContent('Sažetak');
              const solution = sectionContent('Predloženo rješenje');
              const alternatives = sectionContent('Razmatrane alternative');

              if (!isMeaningful(summary)) {
                failures.push('**Sažetak** nije dovoljno opisan.');
              }

              if (!isMeaningful(solution)) {
                failures.push('**Predloženo rješenje** nije opisano.');
              }

              if (!isMeaningful(alternatives)) {
                failures.push('**Razmatrane alternative** nisu navedene.');
              }
            }

            //
            // TASK
            //
            if (template === 'TASK') {
              const summary = sectionContent('Sažetak');
              const acceptance = sectionContent('Kriteriji prihvaćanja');
              const steps = sectionContent('Koraci');

              if (!isMeaningful(summary)) {
                failures.push('**Sažetak** nije dovoljno opisan.');
              }

              if (!isMeaningful(acceptance)) {
                failures.push('**Kriteriji prihvaćanja** nisu navedeni.');
              }

              if (!isMeaningful(steps)) {
                failures.push('**Koraci** nisu opisani.');
              }
            }

            //
            // 4. Everything is OK.
            //
            if (failures.length === 0) {
              console.log(`Issue #${issueNumber} passed validation as ${template}.`);
              return;
            }

            //
            // 5. Invalid issue.
            //
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ['invalid']
            });

            const message = `## ⚠️ Issue nije dovoljno opisan

            Ovaj issue je automatski zatvoren jer ne sadrži dovoljno informacija za obradu.

            **Nedostaje ili nije dovoljno opisano:**

            ${failures.map(f => `- ${f}`).join('\n')}

            Molimo otvorite novi issue koristeći odgovarajući predložak i uključite potrebne informacije.

            Predlošci:

            - 🐛 **Prijava greške**
            - 💡 **Zahtjev za značajku**
            - 🛠️ **Zadatak / Posao**

            Hvala!`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: message
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              state: 'closed'
            });
